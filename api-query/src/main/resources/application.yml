server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: banco-api-query
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banco}
    username: ${SPRING_DATASOURCE_USERNAME:banco}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080/realms/banco}

banco:
  crypto:
    master-key: ${BANCO_CRYPTO_MASTER_KEY:}
  messaging:
    consumer:
      enabled: ${BANCO_MESSAGING_CONSUMER_ENABLED:false}
      topic: ${BANCO_MESSAGING_TOPIC:banco.conta.eventos.v1}
      group-id: ${BANCO_MESSAGING_GROUP_ID:banco-api-query-projections}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [corrId=%X{correlationId:-}] - %msg%n"
