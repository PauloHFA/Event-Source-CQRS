spring:
  application:
    name: banco-es-command
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banco}
    username: ${DB_USER:banco}
    password: ${DB_PASSWORD:banco}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
banco:
  crypto:
    master-key: ${BANCO_CRYPTO_MASTER_KEY:}
    rotation-new-master-key: ${BANCO_CRYPTO_ROTATION_NEW_MASTER_KEY:}
  maintenance:
    enabled: ${BANCO_MAINTENANCE_ENABLED:false}
  projections:
    enabled: ${BANCO_PROJECTIONS_ENABLED:true}
    batch-size: ${BANCO_PROJECTIONS_BATCH_SIZE:200}
    poll-interval: ${BANCO_PROJECTIONS_POLL_INTERVAL:1000}
  transferencia:
    recovery:
      enabled: ${BANCO_TRANSFERENCIA_RECOVERY_ENABLED:true}
      timeout-seconds: ${BANCO_TRANSFERENCIA_RECOVERY_TIMEOUT_SECONDS:300}
      poll-interval: ${BANCO_TRANSFERENCIA_RECOVERY_POLL_INTERVAL:60000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        projection.batch.duration: true
        integration.publisher.batch.duration: true
